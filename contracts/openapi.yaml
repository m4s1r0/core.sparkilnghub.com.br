openapi: 3.1.0
info:
  title: SparkCore — API administrativa
  version: 1.2.0
  description: >-
    Contratos do SparkCore. F00: situação operacional. F01: identidade, sessões do painel, administradores, vínculos, recuperação e bloqueio (/api/v1), e contratos internos para produtos (/internal/v1), com a projeção de acesso descrita em access-projection.md. Convenções em conventions.md. /api/v1/** usa o cookie sparkcore_session (HttpOnly, SameSite=Strict) e verificação de origem em métodos inseguros; /internal/v1/** usa Authorization: Bearer <credencial de aplicação> e nunca cookie. /api/v1/system/status exige sessão de administrador com MFA; /health/live permanece público e sem detalhes. F02: contratantes, catálogo, solicitação e acompanhamento do provisionamento de instâncias (/api/v1) e conexão da instância para o produto (/internal/v1/instances/{slug}/connection, escopo connection).
servers:
  - url: http://127.0.0.1:3000
    description: Desenvolvimento local
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Processo HTTP em execução (sem consultar dependências)
      responses:
        "200":
          description: Processo ativo
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: ok }
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Situação operacional do SparkCore
      description: >
        200 quando o estado geral é SAUDAVEL ou DEGRADADA; 503 com o mesmo corpo e Retry-After quando INDISPONIVEL. O corpo nunca contém credenciais, nomes de usuário MySQL, SQL ou stack trace.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Sistema operando (total ou parcialmente)
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "503":
          description: Componente essencial indisponível
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "500":
          description: Falha inesperada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: AUTH_SESSION_REQUIRED ou AUTH_MFA_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security: [{ coreSession: [] }]
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { $ref: "#/components/schemas/Email" }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          {
            description: Senha correta; segue para o segundo fator. Cookie de sessão pré-MFA emitido.,
            content: { application/json: { schema: { $ref: "#/components/schemas/LoginResult" } } },
          }
        "401": { description: AUTH_INVALID_CREDENTIALS (mesma resposta para conta inexistente) }
        "429": { description: AUTH_THROTTLED com Retry-After }
        "503": { description: SYSTEM_IDENTITY_UNAVAILABLE }
  /api/v1/auth/mfa:
    post:
      operationId: confirmMfa
      security: [{ coreSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [code]
                  properties: { code: { $ref: "#/components/schemas/TotpCode" } }
                - required: [recoveryCode]
                  properties: { recoveryCode: { $ref: "#/components/schemas/RecoveryCode" } }
      responses:
        "200":
          {
            description: Sessão plena; recoveryCode usado exige recadastrar TOTP,
            content: { application/json: { schema: { $ref: "#/components/schemas/LoginResult" } } },
          }
        "401": { description: AUTH_MFA_INVALID }
        "429": { description: AUTH_THROTTLED }
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      security: [{ coreSession: [] }]
      description: Reconfirma o TOTP; vale 5 minutos para ações sensíveis (FR-008).
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [code],
                    properties: { code: { $ref: "#/components/schemas/TotpCode" } },
                  },
              },
          }
      responses:
        "200":
          {
            description: OK,
            content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } },
          }
        "401": { description: AUTH_MFA_INVALID }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ coreSession: [] }]
      responses:
        "204": { description: Sessão encerrada e cookie removido }
  /api/v1/session:
    get:
      operationId: currentSession
      security: [{ coreSession: [] }]
      responses:
        "200":
          {
            description: Sessão atual,
            content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } },
          }
        "401": { description: AUTH_SESSION_REQUIRED }
  /api/v1/account/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      security: [{ coreSession: [] }]
      responses:
        "201":
          {
            description: Segredo exibido uma vez,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/MfaEnrollment" } } },
          }
        "409":
          {
            description: CONFLICT_MFA_ALREADY_ENROLLED (recadastro exige reautenticação ou código de recuperação usado),
          }
  /api/v1/account/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      security: [{ coreSession: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [code],
                    properties: { code: { $ref: "#/components/schemas/TotpCode" } },
                  },
              },
          }
      responses:
        "200":
          {
            description: Códigos de recuperação exibidos uma vez,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/RecoveryCodes" } } },
          }
        "401": { description: AUTH_MFA_INVALID }
  /api/v1/invitations/{token}:
    get:
      operationId: inspectInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Convite válido
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [target, roleLabel, emailMasked, accountExists, expiresAt]
                properties:
                  target: { type: string, enum: [plataforma, instancia] }
                  instanceName: { type: [string, "null"] }
                  roleLabel: { type: string }
                  emailMasked: { type: string }
                  accountExists: { type: boolean }
                  expiresAt: { type: string, format: date-time }
        "404":
          {
            description: INVITATION_INVALID (inexistente,
            usado,
            revogado ou expirado — mesma resposta),
          }
  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      description: >
        Conta nova: informar displayName e password. Conta existente: exige sessão do Core da mesma conta (plataforma) ou autenticação dela no fluxo (instância), sem trocar senha (FR-019).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
                password: { $ref: "#/components/schemas/Password" }
                currentPassword: { type: string, maxLength: 128 }
      responses:
        "200":
          {
            description: Aceito; plataforma segue para cadastro de TOTP,
            content: { application/json: { schema: { $ref: "#/components/schemas/LoginResult" } } },
          }
        "404": { description: INVITATION_INVALID }
        "409": { description: CONFLICT_INVITATION_ACCOUNT_MISMATCH }
        "422": { description: VALIDATION_FAILED / PASSWORD_POLICY_REJECTED }
  /api/v1/recovery-requests:
    post:
      operationId: requestRecovery
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email],
                    properties: { email: { $ref: "#/components/schemas/Email" } },
                  },
              },
          }
      responses:
        "202":
          { description: Sempre a mesma resposta; pedido vai para a fila do administrador (D-07) }
        "429": { description: AUTH_THROTTLED }
    get:
      operationId: listRecoveryRequests
      security: [{ coreSession: [] }]
      description: Pedidos pendentes (handled_at nulo). Gerar link de recuperação para a conta marca como atendidos os pedidos pendentes do mesmo e-mail.
      responses:
        "200":
          {
            description: Fila,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [items],
                        properties:
                          {
                            items:
                              {
                                type: array,
                                items: { $ref: "#/components/schemas/RecoveryRequest" },
                              },
                          },
                      },
                  },
              },
          }
  /api/v1/password-resets/{token}:
    post:
      operationId: completePasswordReset
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [password],
                    properties: { password: { $ref: "#/components/schemas/Password" } },
                  },
              },
          }
      responses:
        "200":
          {
            description: Senha trocada; todas as sessões revogadas,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "404": { description: RESET_INVALID }
        "422": { description: PASSWORD_POLICY_REJECTED }
  /api/v1/platform-admins:
    get:
      operationId: listPlatformAdmins
      security: [{ coreSession: [] }]
      responses:
        "200":
          {
            description: Lista,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [items],
                        properties:
                          {
                            items:
                              {
                                type: array,
                                items: { $ref: "#/components/schemas/PlatformAdmin" },
                              },
                          },
                      },
                  },
              },
          }
  /api/v1/platform-admins/invitations:
    post:
      operationId: invitePlatformAdmin
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email],
                    properties: { email: { $ref: "#/components/schemas/Email" } },
                  },
              },
          }
      responses:
        "201":
          {
            description: Link exibido uma vez,
            content: { application/json: { schema: { $ref: "#/components/schemas/OneTimeLink" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
  /api/v1/platform-admins/{accountId}/deactivate:
    post:
      operationId: deactivatePlatformAdmin
      security: [{ coreSession: [] }]
      parameters:
        [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "204": { description: Inativado; sessões do Core revogadas }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409": { description: CONFLICT_LAST_ADMIN }
  /api/v1/platform-admins/{accountId}/reactivate:
    post:
      operationId: reactivatePlatformAdmin
      security: [{ coreSession: [] }]
      parameters:
        [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "204": { description: Reativado; exige novo login }
        "403": { description: AUTH_REAUTH_REQUIRED }
  /api/v1/accounts:
    get:
      operationId: findAccounts
      security: [{ coreSession: [] }]
      parameters:
        [{ name: email, in: query, required: true, schema: { $ref: "#/components/schemas/Email" } }]
      description: Busca exata pelo e-mail normalizado; sem listagem aberta de contas.
      responses:
        "200":
          {
            description: Zero ou uma conta,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [items],
                        properties:
                          {
                            items:
                              {
                                type: array,
                                maxItems: 1,
                                items: { $ref: "#/components/schemas/AccountSummary" },
                              },
                          },
                      },
                  },
              },
          }
        "422":
          description: VALIDATION_FAILED (e-mail incompleto ou inválido; não há busca parcial)
  /api/v1/accounts/{accountId}:
    get:
      operationId: getAccount
      security: [{ coreSession: [] }]
      parameters:
        [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          {
            description: Conta,
            vínculos e pedidos de recuperação pendentes,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/AccountDetail" } } },
          }
        "404": { description: NOT_FOUND }
  /api/v1/accounts/{accountId}/block-preview:
    get:
      operationId: previewBlock
      security: [{ coreSession: [] }]
      parameters:
        [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Instâncias afetadas (FR-022)
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [instances],
                      properties:
                        {
                          instances:
                            {
                              type: array,
                              items:
                                {
                                  type: object,
                                  additionalProperties: false,
                                  required: [instanceId, name, role],
                                  properties:
                                    {
                                      instanceId: { type: string, format: uuid },
                                      name: { type: string },
                                      role: { $ref: "#/components/schemas/ProductRole" },
                                    },
                                },
                            },
                        },
                    },
                },
            }
  /api/v1/accounts/{accountId}/block:
    post:
      operationId: blockAccount
      security: [{ coreSession: [] }]
      parameters:
        [
          { name: accountId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Bloqueada; resultado por instância,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409": { description: CONFLICT_LAST_ADMIN (se for o último administrador da plataforma) }
  /api/v1/accounts/{accountId}/unblock:
    post:
      operationId: unblockAccount
      security: [{ coreSession: [] }]
      parameters:
        [
          { name: accountId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      description: bloqueada → ativa; replica account_status nas instâncias. Sessões encerradas no bloqueio continuam encerradas.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Desbloqueada; resultado por instância,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409": { description: CONFLICT_STATE (conta não está bloqueada) }
  /api/v1/accounts/{accountId}/password-reset:
    post:
      operationId: issuePasswordReset
      security: [{ coreSession: [] }]
      parameters:
        [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201":
          {
            description: Link de 30 min exibido uma vez,
            content: { application/json: { schema: { $ref: "#/components/schemas/OneTimeLink" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
  /api/v1/instances:
    get:
      operationId: listInstances
      description: >
        Substitui a listagem mínima de F01 (mesmos campos de antes, mais os novos). Sem filtros e sem paginação explícita, devolve a primeira página de 25 (compatível com a interface F01).
      security: [{ coreSession: [] }]
      parameters:
        - { name: contractorId, in: query, schema: { type: string, format: uuid } }
        - { name: productCode, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/InstanceState" } }
        - { name: createdFrom, in: query, schema: { type: string, format: date } }
        - {
            name: createdTo,
            in: query,
            schema: { type: string, format: date },
            description: "inclusivo: datas civis em America/Sao_Paulo, intervalo [createdFrom, createdTo + 1 dia)",
          }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Instâncias paginadas
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InstanceSummary" } }
                  pageInfo: { $ref: "#/components/schemas/PageInfo" }
    post:
      operationId: requestInstance
      description: >
        Reautenticação. Cria a instância (CADASTRADA) e a tarefa de provisionamento numa transação; não espera a tarefa (SC-020). Mesma Idempotency-Key e mesmo corpo → mesma resposta (201); corpo diferente → 409 (T-01).
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstanceRequest" } } }
      responses:
        "201":
          {
            description: Solicitação aceita,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/InstanceCreated" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409":
          description: >
            CONFLICT_SLUG_TAKEN (field /slug), CONFLICT_CONTRACTOR_INACTIVE, CONFLICT_PRODUCT_NOT_PROVISIONABLE (com o motivo), CONFLICT_IDEMPOTENCY_MISMATCH
        "422":
          { description: VALIDATION_FAILED (slug reservado ou inválido, fuso, e-mail, vigência) }
  /api/v1/instances/{instanceId}/members:
    get:
      operationId: listMembers
      security: [{ coreSession: [] }]
      parameters:
        [{ name: instanceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          {
            description: Vínculos e convites pendentes,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [items],
                        properties:
                          {
                            items: { type: array, items: { $ref: "#/components/schemas/Member" } },
                          },
                      },
                  },
              },
          }
  /api/v1/instances/{instanceId}/invitations:
    post:
      operationId: inviteMember
      security: [{ coreSession: [] }]
      parameters:
        [
          { name: instanceId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [email, role],
                      properties:
                        {
                          email: { $ref: "#/components/schemas/Email" },
                          role: { $ref: "#/components/schemas/ProductRole" },
                          initial: { type: boolean, default: false },
                        },
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Link exibido uma vez,
            content: { application/json: { schema: { $ref: "#/components/schemas/OneTimeLink" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
  /api/v1/instances/{instanceId}/members/{membershipId}/role:
    post:
      operationId: changeMemberRole
      security: [{ coreSession: [] }]
      parameters:
        [
          { name: instanceId, in: path, required: true, schema: { type: string, format: uuid } },
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [role, reason, version],
                      properties:
                        {
                          role: { $ref: "#/components/schemas/ProductRole" },
                          reason: { $ref: "#/components/schemas/Reason" },
                          version: { type: integer },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Alterado e replicado,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409":
          {
            description: CONFLICT_VERSION,
            CONFLICT_LAST_ADMIN ou CONFLICT_IDEMPOTENCY_KEY_REUSED (mesma chave com outro corpo); mesma chave e mesmo corpo repetem o resultado,
          }
  /api/v1/instances/{instanceId}/members/{membershipId}/revoke:
    post:
      operationId: revokeMember
      security: [{ coreSession: [] }]
      parameters:
        [
          { name: instanceId, in: path, required: true, schema: { type: string, format: uuid } },
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason, version],
                      properties:
                        {
                          reason: { $ref: "#/components/schemas/Reason" },
                          version: { type: integer },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Revogado e replicado,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409":
          {
            description: CONFLICT_VERSION,
            CONFLICT_LAST_ADMIN ou CONFLICT_IDEMPOTENCY_KEY_REUSED (mesma chave com outro corpo); mesma chave e mesmo corpo repetem o resultado,
          }
  /api/v1/invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      security: [{ coreSession: [] }]
      description: Convites de plataforma e de instância pendentes. Revogar o convite inicial que é o único caminho de acesso da instância é recusado (FR-021).
      parameters:
        [{ name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "204": { description: Revogado (repetir sobre convite já revogado também responde 204) }
        "404": { description: INVITATION_INVALID (inexistente, aceito ou expirado) }
        "409": { description: CONFLICT_LAST_ADMIN }
  /api/v1/access-sync/pending:
    get:
      operationId: listPendingAccessSync
      security: [{ coreSession: [] }]
      responses:
        "200": { description: Revogações/replicações pendentes por instância (FR-027) }

  # ---------- Contratos internos para produtos ----------
  /internal/v1/instances/{slug}/sessions:
    post:
      operationId: createInstanceSession
      security: [{ appCredential: [sessions] }]
      parameters: [{ $ref: "#/components/parameters/InstanceSlug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, clientIp]
              properties:
                email: { $ref: "#/components/schemas/Email" }
                password: { type: string, minLength: 1, maxLength: 128 }
                clientIp:
                  type: string
                  maxLength: 45
                  description: >
                    IP do usuário final, informado pelo produto (responsável por ele pela credencial de aplicação). Limitação: por conta (10 falhas → 15 min) e por `app-ip:<credencial>:<clientIp>` (50 falhas em 15 min); o IP do servidor do produto nunca é usado como origem.
                userAgent: { type: string, maxLength: 300 }
      responses:
        "201":
          {
            description: Sessão gravada na projeção de acesso da instância,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/InstanceSessionCreated" } },
              },
          }
        "401":
          {
            description: AUTH_INVALID_CREDENTIALS (credencial errada,
            sem vínculo,
            conta inativa/bloqueada ou instância de outro produto — mesma resposta),
          }
        "429": { description: AUTH_THROTTLED }
        "503": { description: SYSTEM_IDENTITY_UNAVAILABLE ou SYSTEM_INSTANCE_UNAVAILABLE }
  /internal/v1/instances/{slug}/sessions/touch:
    post:
      operationId: touchInstanceSession
      security: [{ appCredential: [sessions] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
        ]
      responses:
        "204": { description: Atividade registrada (no máximo 1 vez a cada 5 min por sessão) }
        "401": { description: AUTH_SESSION_INVALID }
  /internal/v1/instances/{slug}/members:
    get:
      operationId: listLocalMembers
      security: [{ appCredential: [members] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
        ]
      responses:
        "200":
          {
            description: Vínculos da instância (sem e-mail de membros ativos),
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [items],
                        properties:
                          {
                            items: { type: array, items: { $ref: "#/components/schemas/Member" } },
                          },
                      },
                  },
              },
          }
        "401": { description: AUTH_SESSION_INVALID }
        "403": { description: AUTH_FORBIDDEN (sessão válida sem papel administrador) }
  /internal/v1/instances/{slug}/invitations:
    post:
      operationId: inviteLocalMember
      security: [{ appCredential: [members] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [email, role],
                      properties:
                        {
                          email: { $ref: "#/components/schemas/Email" },
                          role: { $ref: "#/components/schemas/ProductRole" },
                        },
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Link exibido uma vez ao administrador da instância,
            content: { application/json: { schema: { $ref: "#/components/schemas/OneTimeLink" } } },
          }
        "403": { description: AUTH_FORBIDDEN }
  /internal/v1/instances/{slug}/invitations/{invitationId}/revoke:
    post:
      operationId: revokeLocalInvitation
      security: [{ appCredential: [members] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
          { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason],
                      properties: { reason: { $ref: "#/components/schemas/Reason" } },
                    },
                },
            },
        }
      responses:
        "204": { description: Revogado }
        "403": { description: AUTH_FORBIDDEN }
        "404": { description: NOT_FOUND (inclusive convite de outra instância) }
        "409": { description: CONFLICT_LAST_ADMIN }
  /internal/v1/instances/{slug}/members/{membershipId}/role:
    post:
      operationId: changeLocalMemberRole
      security: [{ appCredential: [members] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [role, reason, version],
                      properties:
                        {
                          role: { $ref: "#/components/schemas/ProductRole" },
                          reason: { $ref: "#/components/schemas/Reason" },
                          version: { type: integer },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Alterado,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "404": { description: NOT_FOUND (inclusive vínculo de outra instância) }
        "409":
          {
            description: CONFLICT_VERSION,
            CONFLICT_LAST_ADMIN ou CONFLICT_IDEMPOTENCY_KEY_REUSED (mesma chave com outro corpo); mesma chave e mesmo corpo repetem o resultado,
          }
  /internal/v1/instances/{slug}/members/{membershipId}/revoke:
    post:
      operationId: revokeLocalMember
      security: [{ appCredential: [members] }]
      parameters:
        [
          { $ref: "#/components/parameters/InstanceSlug" },
          { $ref: "#/components/parameters/InstanceSessionHeader" },
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [reason, version],
                      properties:
                        {
                          reason: { $ref: "#/components/schemas/Reason" },
                          version: { type: integer },
                        },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Revogado,
            content: { application/json: { schema: { $ref: "#/components/schemas/SyncOutcome" } } },
          }
        "404": { description: NOT_FOUND }
        "409":
          {
            description: CONFLICT_VERSION,
            CONFLICT_LAST_ADMIN ou CONFLICT_IDEMPOTENCY_KEY_REUSED (mesma chave com outro corpo); mesma chave e mesmo corpo repetem o resultado,
          }
  /api/v1/contractors:
    get:
      operationId: listContractors
      security: [{ coreSession: [] }]
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 120 },
            description: nome,
            documento ou contato,
          }
        - { name: status, in: query, schema: { type: string, enum: [ativo, inativo] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Contratantes paginados com produtos e quantidade de instâncias
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ContractorSummary" } }
                  pageInfo: { $ref: "#/components/schemas/PageInfo" }
    post:
      operationId: createContractor
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ContractorInput" } } }
      responses:
        "201":
          {
            description: Criado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Contractor" } } },
          }
        "409":
          {
            description: CONFLICT_DOCUMENT_TAKEN (field /document; details com o contratante existente) ou CONFLICT_IDEMPOTENCY_MISMATCH,
          }
        "422":
          { description: VALIDATION_FAILED (documento inválido, tipo incompatível, telefone, UF) }
  /api/v1/contractors/similar:
    get:
      operationId: findSimilarContractors
      security: [{ coreSession: [] }]
      parameters:
        - { name: legalName, in: query, schema: { type: string, maxLength: 200 } }
        - { name: document, in: query, schema: { type: string, maxLength: 18 } }
      responses:
        "200":
          description: Até 10 possíveis homônimos ou mesmo documento; nada é fundido (SC-005)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      maxItems: 10,
                      items: { $ref: "#/components/schemas/SimilarContractor" },
                    }
  /api/v1/contractors/{contractorId}:
    get:
      operationId: getContractor
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ContractorId" }]
      responses:
        "200":
          description: Contratante com suas instâncias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorDetail"
        "404": { description: NOT_FOUND }
    put:
      operationId: updateContractor
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ContractorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorUpdate"
      responses:
        "200":
          {
            description: Atualizado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Contractor" } } },
          }
        "409": { description: CONFLICT_VERSION (recarregar) ou CONFLICT_DOCUMENT_TAKEN }
        "422": { description: VALIDATION_FAILED }
  /api/v1/contractors/{contractorId}/inactivate:
    post:
      operationId: inactivateContractor
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ContractorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, version]
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200":
          {
            description: Inativado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Contractor" } } },
          }
        "409":
          description: >
            CONFLICT_CONTRACTOR_HAS_ACTIVE_INSTANCES (error.details lista {field: "/instances", code: instanceId, message: nome de exibição}) ou CONFLICT_VERSION
  /api/v1/contractors/{contractorId}/reactivate:
    post:
      operationId: reactivateContractor
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ContractorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, version]
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200":
          {
            description: Reativado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Contractor" } } },
          }
        "409": { description: CONFLICT_VERSION }
  /api/v1/products:
    get:
      operationId: listProducts
      security: [{ coreSession: [] }]
      responses:
        "200":
          description: Catálogo; em produção não inclui produtos de referência
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  { items: { type: array, items: { $ref: "#/components/schemas/Product" } } }
  /api/v1/products/{code}:
    get:
      operationId: getProduct
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductCode" }]
      responses:
        "200":
          {
            description: Produto,
            content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } },
          }
        "404": { description: NOT_FOUND (inclusive produto de referência em produção) }
    put:
      operationId: updateProduct
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, description, version]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 280 }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200":
          {
            description: Atualizado,
            content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } },
          }
        "409": { description: CONFLICT_VERSION }
        "422":
          {
            description: VALIDATION_FAILED (campos desconhecidos,
            como código ou provisionador,
            são recusados),
          }
  /api/v1/products/{code}/inactivate:
    post:
      operationId: inactivateProduct
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, version]
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200": { description: Inativado; instâncias existentes não mudam (SC-008) }
        "409": { description: CONFLICT_VERSION }
  /api/v1/products/{code}/reactivate:
    post:
      operationId: reactivateProduct
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, version]
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200": { description: Reativado }
        "409": { description: CONFLICT_VERSION }
  /api/v1/instances/preview:
    post:
      operationId: previewInstance
      description: Normaliza e confere o slug e os dados, sem reservar nada.
      security: [{ coreSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstanceRequest" } } }
      responses:
        "200":
          description: Resumo sem credenciais
          content:
            application/json:
              schema:
                type: object
                required: [slug, slugAvailable, contractor, product, timezone, initialAdminEmail]
                properties:
                  slug: { type: string }
                  slugAvailable: { type: boolean }
                  contractor: { $ref: "#/components/schemas/ContractorSummary" }
                  product: { $ref: "#/components/schemas/Product" }
                  timezone: { type: string }
                  initialAdminEmail: { type: string }
        "422": { description: VALIDATION_FAILED }
  /api/v1/instances/timezones:
    get:
      operationId: listTimezones
      security: [{ coreSession: [] }]
      responses:
        "200":
          description: Fusos suportados (D-09), padrão America/Sao_Paulo
          content:
            application/json:
              schema:
                type: object
                required: [items, default]
                properties:
                  items: { type: array, items: { type: string } }
                  default: { type: string }
  /api/v1/instances/{instanceId}:
    get:
      operationId: getInstance
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          {
            description: Detalhe,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/InstanceDetail" } } },
          }
        "404": { description: NOT_FOUND }
    put:
      operationId: updateInstance
      description: Só nome de exibição, anotações e vigência; slug, produto e contratante são recusados (422).
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, notes, validFrom, validUntil, version]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                notes: { type: [string, "null"], maxLength: 4000 }
                validFrom: { type: [string, "null"], format: date }
                validUntil: { type: [string, "null"], format: date }
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200":
          {
            description: Atualizado,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/InstanceDetail" } } },
          }
        "409": { description: CONFLICT_VERSION }
        "422": { description: VALIDATION_FAILED }
  /api/v1/instances/{instanceId}/provisioning:
    get:
      operationId: getProvisioning
      security: [{ coreSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          {
            description: Tarefa e etapas,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ProvisioningTask" } } },
          }
        "404": { description: NOT_FOUND }
  /api/v1/instances/{instanceId}/provisioning/retry:
    post:
      operationId: retryProvisioning
      description: Reautenticação. Só em FALHA_PROVISIONAMENTO; retoma da última etapa válida (SC-023).
      security: [{ coreSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { $ref: "#/components/schemas/Reason" } }
      responses:
        "202":
          {
            description: Nova execução agendada,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ProvisioningTask" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409":
          {
            description: CONFLICT_STATE (instância não está em falha) ou CONFLICT_IDEMPOTENCY_MISMATCH,
          }
  /api/v1/instances/{instanceId}/initial-invitation/issue:
    post:
      operationId: issueInitialInvitation
      description: >
        Reautenticação. Só com a instância PRONTA (F03 amplia para ATIVA sem administrador). Gera link de uso único exibido uma vez (D-07), válido por 48 h; o anterior deixa de valer.
      security: [{ coreSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          {
            description: Link exibido uma vez,
            content: { application/json: { schema: { $ref: "#/components/schemas/OneTimeLink" } } },
          }
        "403": { description: AUTH_REAUTH_REQUIRED }
        "409": { description: CONFLICT_STATE (não pronta) ou CONFLICT_INITIAL_INVITATION_ACCEPTED }
  /internal/v1/instances/{slug}/connection:
    get:
      operationId: getInstanceConnection
      description: >
        Conexão da instância para o produto dono da credencial (escopo `connection`). Instância de outro produto ou inexistente → 404 idêntico. Resposta com Cache-Control no-store; nunca registrada em log. O produto pode mantê-la em memória (T-15).
      security: [{ appCredential: [connection] }]
      parameters: [{ $ref: "#/components/parameters/InstanceSlug" }]
      responses:
        "200":
          description: Conexão
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            { application/json: { schema: { $ref: "#/components/schemas/InstanceConnection" } } }
        "401":
          {
            description: "AUTH_APP_CREDENTIAL_INVALID (ausente, revogada, vencida ou sem o escopo connection, como em F01)",
          }
        "404": { description: NOT_FOUND }
        "409":
          { description: INSTANCE_NOT_READY (CADASTRADA, PROVISIONANDO ou FALHA_PROVISIONAMENTO) }
components:
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    InstanceSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?$" }
    InstanceSessionHeader:
      name: X-Instance-Session
      in: header
      required: true
      description: INSTANCE_TOKEN do usuário que age (administrador da instância)
      schema: { type: string, minLength: 43, maxLength: 64 }
    ContractorId:
      name: contractorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9]{2,15}$" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  headers:
    CorrelationId:
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthState:
      type: string
      enum: [SAUDAVEL, DEGRADADA, INDISPONIVEL, DESCONHECIDA]
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [server, worker, spark_core, spark_identity]
        status: { $ref: "#/components/schemas/HealthState" }
        schemaVersion:
          description: Última versão aplicada, apenas para bancos
          type: [integer, "null"]
          minimum: 0
        expectedSchemaVersion:
          description: Versão esperada pelo artefato implantado, apenas para bancos
          type: [integer, "null"]
          minimum: 0
        reason:
          description: Código estável do motivo quando não SAUDAVEL
          type: [string, "null"]
          enum:
            - null
            - DB_UNREACHABLE
            - SCHEMA_BEHIND
            - SCHEMA_FAILED
            - SCHEMA_CHECKSUM_MISMATCH
            - SCHEMA_UNKNOWN_VERSION
            - WORKER_STALE
            - WORKER_ABSENT
        checkedAt: { type: string, format: date-time }
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, version, environment, status, checkedAt, components]
      properties:
        service: { const: sparkcore }
        version:
          description: Versão do artefato implantado (semver)
          type: string
          pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
        environment:
          type: string
          enum: [development, homologation, production]
        status: { $ref: "#/components/schemas/HealthState" }
        checkedAt: { type: string, format: date-time }
        components:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/ComponentStatus" }
        provisioning:
          type: object
          additionalProperties: false
          description: "F02: tarefas de provisionamento (sem detalhe de instância); ausente se não puder ser lida"
          required:
            - pending
            - waitingRetry
            - failed
          properties:
            pending:
              type: integer
              minimum: 0
            waitingRetry:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, field, retryable, correlationId]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
            message: { type: string, minLength: 1 }
            field: { type: [string, "null"] }
            retryable: { type: boolean }
            correlationId: { type: string, format: uuid }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
    Email: { type: string, format: email, maxLength: 254 }
    Password: { type: string, minLength: 12, maxLength: 128 }
    TotpCode: { type: string, pattern: "^[0-9]{6}$" }
    RecoveryCode: { type: string, pattern: "^[A-Z2-7]{10}$" }
    Reason: { type: string, minLength: 3, maxLength: 500 }
    ProductRole: { type: string, enum: [administrador, colaborador] }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [account, mfa, platformRole]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [id, displayName, email]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
            email: { type: string }
        mfa:
          type: object
          additionalProperties: false
          required: [enrolled, confirmed, reauthValidUntil]
          properties:
            enrolled: { type: boolean }
            confirmed: { type: boolean }
            reauthValidUntil: { type: [string, "null"], format: date-time }
        platformRole: { type: [string, "null"], enum: [administrador, null] }
    LoginResult:
      type: object
      additionalProperties: false
      required: [next]
      properties:
        next:
          type: string
          enum: [mfa, mfa_enrollment, done]
          description: mfa = informar TOTP; mfa_enrollment = cadastrar TOTP (primeiro acesso)
    OneTimeLink:
      type: object
      additionalProperties: false
      required: [link, expiresAt]
      description: Exibido uma única vez (D-07); não pode ser consultado de novo.
      properties:
        link: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [otpauthUri, secret]
      properties:
        otpauthUri: { type: string }
        secret: { type: string, description: base32, exibido uma vez }
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          {
            type: array,
            minItems: 10,
            maxItems: 10,
            items: { $ref: "#/components/schemas/RecoveryCode" },
          }
    PlatformAdmin:
      type: object
      additionalProperties: false
      required: [accountId, invitationId, displayName, email, status, lastLoginAt]
      properties:
        accountId: { type: [string, "null"], format: uuid }
        invitationId:
          {
            type: [string, "null"],
            format: uuid,
            description: preenchido quando status = convite_pendente,
          }
        displayName: { type: [string, "null"] }
        email: { type: string }
        status: { type: string, enum: [ativo, inativo, convite_pendente] }
        lastLoginAt: { type: [string, "null"], format: date-time }
    Member:
      type: object
      additionalProperties: false
      required: [membershipId, invitationId, displayName, role, status, version]
      properties:
        membershipId: { type: [string, "null"], format: uuid }
        invitationId:
          {
            type: [string, "null"],
            format: uuid,
            description: preenchido quando status = convite_pendente,
          }
        displayName: { type: [string, "null"] }
        emailMasked:
          {
            type: [string, "null"],
            description: "a***@dominio — só para a plataforma e para convites pendentes",
          }
        role: { $ref: "#/components/schemas/ProductRole" }
        status: { type: string, enum: [ativo, revogado, convite_pendente] }
        version: { type: [integer, "null"] }
    SyncOutcome:
      type: object
      additionalProperties: false
      required: [instances]
      description: Resultado por instância de operações que revogam (FR-027).
      properties:
        instances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [instanceId, status]
            properties:
              instanceId: { type: string, format: uuid }
              status: { type: string, enum: [aplicada, pendente] }
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, displayName, email, status]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        status: { type: string, enum: [ativa, inativa, bloqueada] }
    AccountDetail:
      type: object
      additionalProperties: false
      required: [account, mfaEnrolled, platformRole, memberships, pendingRecoveryRequests]
      properties:
        account: { $ref: "#/components/schemas/AccountSummary" }
        mfaEnrolled: { type: boolean }
        platformRole: { type: [string, "null"], enum: [ativo, inativo, null] }
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [membershipId, instanceId, instanceName, role, status]
            properties:
              membershipId: { type: string, format: uuid }
              instanceId: { type: string, format: uuid }
              instanceName: { type: string }
              role: { $ref: "#/components/schemas/ProductRole" }
              status: { type: string, enum: [ativo, revogado] }
        pendingRecoveryRequests: { type: integer, minimum: 0 }
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [id, email, accountId, createdAt]
      description: Visível só para administradores da plataforma; accountId nulo quando não há conta.
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        accountId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    InstanceSessionCreated:
      type: object
      additionalProperties: false
      required: [token, expiresAt, idleTimeoutSeconds, account, role]
      properties:
        token: { type: string, description: INSTANCE_TOKEN — 32 bytes base64url, opaco }
        expiresAt: { type: string, format: date-time }
        idleTimeoutSeconds: { type: integer, const: 7200 }
        account:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        role: { $ref: "#/components/schemas/ProductRole" }
    Version:
      type: integer
      minimum: 1
      description: Versão otimista; enviada de volta na edição (COM-027)
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Address:
      type: object
      additionalProperties: false
      properties:
        cep: { type: string, pattern: "^[0-9]{8}$" }
        logradouro: { type: string, maxLength: 120 }
        numero: { type: string, maxLength: 20 }
        complemento: { type: string, maxLength: 60 }
        bairro: { type: string, maxLength: 80 }
        cidade: { type: string, maxLength: 80 }
        uf: { type: string, pattern: "^[A-Z]{2}$" }
    ContractorInput:
      type: object
      additionalProperties: false
      required: [legalName, displayName, personType, contactName, email]
      properties:
        legalName: { type: string, minLength: 2, maxLength: 200 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        personType: { type: string, enum: [fisica, juridica] }
        document:
          type: [string, "null"]
          maxLength: 18
          description: CPF ou CNPJ (numérico ou alfanumérico), com ou sem pontuação
        contactName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 20 }
        address: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
    Contractor:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          displayName,
          personType,
          document,
          contactName,
          email,
          phone,
          address,
          status,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        displayName: { type: string }
        personType: { type: string, enum: [fisica, juridica] }
        document: { type: [string, "null"], description: normalizado (sem pontuação) }
        contactName: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        address: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
        status: { type: string, enum: [ativo, inativo] }
        version: { $ref: "#/components/schemas/Version" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContractorSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, legalName, personType, document, status, products, instanceCount]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        legalName: { type: string }
        personType: { type: string, enum: [fisica, juridica] }
        document: { type: [string, "null"] }
        status: { type: string, enum: [ativo, inativo] }
        products: { type: array, items: { type: string } }
        instanceCount: { type: integer }
    SimilarContractor:
      type: object
      additionalProperties: false
      required: [id, displayName, legalName, document, status, match]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        legalName: { type: string }
        document: { type: [string, "null"] }
        status: { type: string, enum: [ativo, inativo] }
        match: { type: string, enum: [documento, nome] }
    Product:
      type: object
      additionalProperties: false
      required:
        [
          code,
          name,
          description,
          status,
          provisioner,
          deployedVersion,
          supportedSchemaVersion,
          provisionable,
          notProvisionableReason,
          version,
        ]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ativo, inativo] }
        provisioner: { type: [string, "null"] }
        deployedVersion: { type: [integer, "null"] }
        supportedSchemaVersion: { type: [integer, "null"] }
        provisionable: { type: boolean }
        notProvisionableReason:
          type: [string, "null"]
          enum:
            [SEM_PROVISIONADOR, ARTEFATO_INVALIDO, PRODUTO_INATIVO, AMBIENTE_NAO_PERMITIDO, null]
        version: { $ref: "#/components/schemas/Version" }
    InstanceState:
      type: string
      enum:
        [
          CADASTRADA,
          PROVISIONANDO,
          FALHA_PROVISIONAMENTO,
          PRONTA,
          ATIVA,
          SUSPENSA,
          MANUTENCAO,
          ENCERRADA,
        ]
    InstanceRequest:
      type: object
      additionalProperties: false
      required: [contractorId, productCode, displayName, slug, timezone, initialAdminEmail]
      properties:
        contractorId: { type: string, format: uuid }
        productCode: { type: string }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 1, maxLength: 80, description: normalizado no servidor }
        timezone: { type: string, default: America/Sao_Paulo }
        initialAdminEmail: { type: string, format: email, maxLength: 254 }
        notes: { type: [string, "null"], maxLength: 4000 }
        validFrom: { type: [string, "null"], format: date }
        validUntil: { type: [string, "null"], format: date }
    InstanceSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          contractorId,
          contractorName,
          productCode,
          slug,
          displayName,
          state,
          synthetic,
          lastTask,
          validityExpired,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        contractorId: { type: string, format: uuid }
        contractorName: { type: string }
        productCode: { type: string }
        slug: { type: string }
        displayName: { type: string }
        state: { $ref: "#/components/schemas/InstanceState" }
        synthetic: { type: boolean }
        lastTask:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [protocol, status]
              properties:
                protocol: { type: string, pattern: "^PRV-[0-9]{6,}$" }
                status: { $ref: "#/components/schemas/TaskStatus" }
        validityExpired: { type: boolean }
        createdAt: { type: string, format: date-time }
    InitialInvitationStatus:
      type: string
      enum: [aguardando_emissao, emitido, expirado, aceito, revogado, inexistente]
    InstanceDetail:
      type: object
      additionalProperties: false
      description: Detalhe da instância
      required:
        - id
        - contractorId
        - contractorName
        - productCode
        - slug
        - displayName
        - state
        - synthetic
        - lastTask
        - validityExpired
        - createdAt
        - timezone
        - initialAdminEmail
        - schemaVersion
        - notes
        - validFrom
        - validUntil
        - version
        - initialInvitation
        - transitions
      properties:
        id:
          type: string
          format: uuid
        contractorId:
          type: string
          format: uuid
        contractorName:
          type: string
        productCode:
          type: string
        slug:
          type: string
        displayName:
          type: string
        state:
          $ref: "#/components/schemas/InstanceState"
        synthetic:
          type: boolean
        lastTask:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - protocol
                - status
              properties:
                protocol:
                  type: string
                  pattern: ^PRV-[0-9]{6,}$
                status:
                  $ref: "#/components/schemas/TaskStatus"
        validityExpired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        timezone:
          type: string
        initialAdminEmail:
          type: string
        schemaVersion:
          type:
            - integer
            - "null"
        notes:
          type:
            - string
            - "null"
        validFrom:
          type:
            - string
            - "null"
          format: date
        validUntil:
          type:
            - string
            - "null"
          format: date
        version:
          $ref: "#/components/schemas/Version"
        initialInvitation:
          type: object
          required:
            - status
            - expiresAt
          properties:
            status:
              $ref: "#/components/schemas/InitialInvitationStatus"
            expiresAt:
              type:
                - string
                - "null"
              format: date-time
        transitions:
          type: array
          items:
            type: object
            required:
              - from
              - to
              - actorKind
              - actorName
              - reason
              - at
            properties:
              from:
                oneOf:
                  - $ref: "#/components/schemas/InstanceState"
                  - type: "null"
              to:
                $ref: "#/components/schemas/InstanceState"
              actorKind:
                type: string
                enum:
                  - usuario
                  - sistema
              actorName:
                type: string
              reason:
                type:
                  - string
                  - "null"
              at:
                type: string
                format: date-time
    TaskStatus:
      type: string
      enum: [pendente, em_execucao, aguardando_repeticao, concluida, falhou]
    StepName:
      type: string
      enum:
        [
          validar,
          reservar,
          criar_bancos,
          criar_credencial,
          aplicar_migracoes,
          configurar,
          preparar_convite,
          verificar,
          concluir,
        ]
    ProvisioningTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          protocol,
          instanceId,
          instanceState,
          status,
          currentStep,
          runNumber,
          attempt,
          maxAttempts,
          nextAttemptAt,
          artifactVersion,
          error,
          steps,
          createdAt,
          startedAt,
          finishedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string, pattern: "^PRV-[0-9]{6,}$" }
        instanceId: { type: string, format: uuid }
        instanceState: { $ref: "#/components/schemas/InstanceState" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        currentStep: { oneOf: [{ $ref: "#/components/schemas/StepName" }, { type: "null" }] }
        runNumber: { type: integer }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        artifactVersion: { type: integer }
        error:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, message, step, retryable]
              properties:
                code:
                  type: string
                  description: >
                    PROVISIONING_RESOURCE_CONFLICT, PROVISIONING_MIGRATION_FAILED, PROVISIONING_MIGRATION_INTERRUPTED, PROVISIONING_PRIVILEGE_MISSING, PROVISIONING_ARTIFACT_INVALID, PROVISIONING_ARTIFACT_CHANGED, PROVISIONING_DEPENDENCY_UNAVAILABLE, PROVISIONING_VERIFICATION_FAILED
                message: { type: string }
                step: { $ref: "#/components/schemas/StepName" }
                retryable:
                  type: boolean
                  description: true quando "Repetir" pode resolver sem procedimento operacional
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [step, runNumber, attempt, status, startedAt, finishedAt, durationMs, errorCode]
            properties:
              step: { $ref: "#/components/schemas/StepName" }
              runNumber: { type: integer }
              attempt: { type: integer }
              status:
                { type: string, enum: [em_execucao, concluida, falhou, interrompida, ignorada] }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: [string, "null"], format: date-time }
              durationMs: { type: [integer, "null"] }
              errorCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    InstanceCreated:
      type: object
      additionalProperties: false
      required: [instance, task]
      properties:
        instance: { $ref: "#/components/schemas/InstanceSummary" }
        task:
          type: object
          required: [id, protocol, status]
          properties:
            id: { type: string, format: uuid }
            protocol: { type: string }
            status: { $ref: "#/components/schemas/TaskStatus" }
    InstanceConnection:
      type: object
      additionalProperties: false
      required:
        [instanceId, state, host, port, database, accessDatabase, user, password, credentialVersion]
      properties:
        instanceId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/InstanceState" }
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        accessDatabase: { type: string }
        user: { type: string }
        password: { type: string, description: "Segredo; nunca registrar em log" }
        credentialVersion: { type: integer }
    ContractorDetail:
      type: object
      additionalProperties: false
      description: Contratante com suas instâncias
      required:
        - id
        - legalName
        - displayName
        - personType
        - document
        - contactName
        - email
        - phone
        - address
        - status
        - version
        - createdAt
        - updatedAt
        - instances
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        displayName:
          type: string
        personType:
          type: string
          enum:
            - fisica
            - juridica
        document:
          type:
            - string
            - "null"
          description: normalizado (sem pontuação)
        contactName:
          type: string
        email:
          type: string
        phone:
          type:
            - string
            - "null"
        address:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        status:
          type: string
          enum:
            - ativo
            - inativo
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSummary"
    ContractorUpdate:
      type: object
      additionalProperties: false
      required:
        - legalName
        - displayName
        - personType
        - contactName
        - email
        - version
      properties:
        legalName:
          type: string
          minLength: 2
          maxLength: 200
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        personType:
          type: string
          enum:
            - fisica
            - juridica
        document:
          type:
            - string
            - "null"
          maxLength: 18
          description: CPF ou CNPJ (numérico ou alfanumérico), com ou sem pontuação
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type:
            - string
            - "null"
          maxLength: 20
        address:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        version:
          $ref: "#/components/schemas/Version"
  securitySchemes:
    coreSession:
      type: apiKey
      in: cookie
      name: sparkcore_session
    appCredential:
      type: http
      scheme: bearer
      description: "<id>.<segredo> de app_credential, com escopo `sessions` ou `members`"
